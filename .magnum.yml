env: RUN_EXPENSIVE="false"
     R_LIBS_SITE="/usr/lib/R/library"

before_install:
  - cd code/
  - curl -sOL http://raw.github.com/larskotthoff/r-travis/master/scripts/travis-tool.sh
  - chmod 755 ./travis-tool.sh
  - sudo apt-get -y install software-properties-common python-software-properties
  - sudo add-apt-repository -y ppa:marutter/rrutter
  - sudo apt-get update
  - sudo apt-get install -y libgmp-dev
  - ./travis-tool.sh bootstrap
install:
  - ./travis-tool.sh aptget_install r-cran-rjava
  - sudo R CMD javareconf
  - sudo ./travis-tool.sh install_deps
  - sudo ./travis-tool.sh install_r e1071 kernlab RWeka devtools
  - sudo R --no-save <<< 'library("devtools"); install_github("berndbischl/ParamHelpers")'
  - sudo R --no-save <<< 'library("devtools"); install_github("mlr-org/mlr", dependencies = TRUE)'
  - java -cp /usr/lib/R/library/RWekajars/java/weka.jar weka.core.WekaPackageManager -install-package XMeans
  - sudo mv /usr/lib/R/site-library/* /usr/lib/R/library || true
  - sudo mv /usr/local/lib/R/site-library/* /usr/lib/R/library || true
  - sudo R CMD INSTALL .
script:
  - cd tests
  - Rscript run-all.R
  - ./travis-tool.sh run_tests
