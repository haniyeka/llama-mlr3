env: RUN_EXPENSIVE="false"
     R_LIBS_SITE="/usr/lib/R/library"

before_install:
  - sudo apt-get update
  - sudo apt-get install -y software-properties-common python-software-properties ed wget unzip
  - sudo add-apt-repository -y ppa:marutter/rrutter
  - sudo add-apt-repository -y ppa:marutter/c2d4u
  - sudo apt-get update
  - sudo apt-get install -y libgmp-dev
  - sudo apt-get install -y r-cran-rjava
  - sudo R CMD javareconf
  - sudo apt-get build-dep r-cran-rgl
  - sudo R --no-save <<< 'install.packages(c("devtools", "mlr"), dependencies = TRUE, Ncpus = 2, repos="http://cran.rstudio.com/")'
  - sudo R --no-save <<< 'library("devtools"); install_github("berndbischl/ParamHelpers")'
  - sudo R --no-save <<< 'library("devtools"); install_github("mlr-org/mlr", dependencies = TRUE)'
  - java -cp /usr/lib/R/library/RWekajars/java/weka.jar weka.core.WekaPackageManager -install-package XMeans
script:
  - R CMD build code
  - R CMD check llama_*.tar.gz
