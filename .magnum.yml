env: NOT_CRAN="true"

before_install:
  - cd code/
  - curl -sOL http://raw.github.com/larskotthoff/r-travis/master/scripts/travis-tool.sh
  - chmod 755 ./travis-tool.sh
  - sudo apt-get -y install software-properties-common python-software-properties
  - ./travis-tool.sh bootstrap
install:
  - ./travis-tool.sh aptget_install r-cran-rjava
  - sudo R CMD javareconf
  - ./travis-tool.sh install_deps
  - ./travis-tool.sh install_r kernlab RWeka
  - sudo Rscript -e 'install.packages(commandArgs(TRUE), repos="http://cran.rstudio.com")' "e1071"
  - java -cp /usr/local/lib/R/site-library/RWekajars/java/weka.jar weka.core.WekaPackageManager -install-package XMeans
script:
  - ./travis-tool.sh run_tests
